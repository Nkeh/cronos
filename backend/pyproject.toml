[project]
name = "cronos-backend"
version = "0.1.0"
description = "Cronos API, runner and notifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib==5.1.3",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "certifi==2026.7.22",
    "cryptography==46.0.1",
    "fastapi==0.142.2",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis[hiredis]==8.1.0",
    "sentry-sdk==2.71.0",
    "sqlalchemy[asyncio]==2.1.3",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both scopes must match "session" — fixtures and test items on different
# loops is exactly how asyncpg connections end up closed against a dead loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "migration: full schema round trip (downgrade base -> upgrade head), destructive mid-session — run explicitly, not in the default suite",
]
addopts = "-m 'not migration'"

